<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="San — hacker android in a hoodie">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1420"/>
      <stop offset="1" stop-color="#03080f"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2331"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8ffcf"/>
      <stop offset="0.55" stop-color="#22e37a"/>
      <stop offset="1" stop-color="#12a955"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0" stop-color="#22ff88" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a8ffcf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a8ffcf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tileClip">
      <rect width="128" height="128" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <!-- Dark tile bg -->
    <rect width="128" height="128" fill="url(#tile)"/>

    <!-- Faint matrix code in the background -->
    <g fill="#22ff88" opacity="0.10" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="7" font-weight="600">
      <text x="6"   y="18">01</text>
      <text x="6"   y="46">10</text>
      <text x="6"   y="86">11</text>
      <text x="6"   y="118">00</text>
      <text x="112" y="26">10</text>
      <text x="112" y="60">01</text>
      <text x="112" y="100">11</text>
    </g>

    <!-- Ambient neon glow behind the character -->
    <ellipse cx="64" cy="70" rx="58" ry="52" fill="url(#glow)"/>

    <!-- Neon outline outer stroke (hacker halo) -->
    <path d="M22 122
             L22 96
             Q22 68 36 52
             Q34 30 50 20
             Q56 14 64 14
             Q72 14 78 20
             Q94 30 92 52
             Q106 68 106 96
             L106 122 Z"
          fill="none"
          stroke="#22ff88"
          stroke-width="0.9"
          opacity="0.5"/>

    <!-- Hood + shoulders (single dark silhouette, minimal) -->
    <path d="M18 128
             L18 102
             Q18 74 34 58
             Q32 30 50 18
             Q56 12 64 12
             Q72 12 78 18
             Q96 30 94 58
             Q110 74 110 102
             L110 128 Z"
          fill="url(#hood)"/>

    <!-- Hood inner shadow (creates the opening around the face) -->
    <path d="M34 74
             Q32 42 50 26
             Q56 20 64 20
             Q72 20 78 26
             Q96 42 94 74
             Q80 62 64 62
             Q48 62 34 74 Z"
          fill="#050b12"/>

    <!-- Hood top rim glow -->
    <path d="M38 32 Q50 18 64 16 Q78 18 90 32"
          fill="none" stroke="#22ff88" stroke-width="1" opacity="0.55" stroke-linecap="round"/>

    <!-- Antennae (drawn BEFORE head, tips peek above) -->
    <line x1="52" y1="24" x2="55" y2="42" stroke="#a8ffcf" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="76" y1="24" x2="73" y2="42" stroke="#a8ffcf" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Android head: green dome with flat bottom -->
    <path d="M42 64
             Q42 42 64 42
             Q86 42 86 64
             Q86 78 76 82
             L52 82
             Q42 78 42 64 Z"
          fill="url(#face)"/>

    <!-- Eye glow halos -->
    <circle cx="54" cy="64" r="8" fill="url(#eyeGlow)"/>
    <circle cx="74" cy="64" r="8" fill="url(#eyeGlow)"/>

    <!-- Eyes (dark pupils with bright core) -->
    <circle cx="54" cy="64" r="4" fill="#031610"/>
    <circle cx="74" cy="64" r="4" fill="#031610"/>
    <circle cx="54" cy="64" r="1.8" fill="#eaffef"/>
    <circle cx="74" cy="64" r="1.8" fill="#eaffef"/>

    <!-- Terminal prompt on the chest -->
    <text x="64" y="110"
          text-anchor="middle"
          font-family="ui-monospace, 'JetBrains Mono', monospace"
          font-size="10"
          font-weight="700"
          fill="#22ff88"
          opacity="0.95"
          letter-spacing="1.5">&gt;_ SAN</text>
  </g>
</svg>
